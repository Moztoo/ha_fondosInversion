services:
  bbva_fondos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbva_fondos
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - HOST=0.0.0.0
      - PORT=8088
      - DATABASE_PATH=/app/data/bbva_fondos.db
      - PDF_DOWNLOAD_TIMEOUT=30
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/v1/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
